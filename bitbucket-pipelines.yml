# GCD-8 / GCD-34: CI for mobilelocker-gcdwebserver
# This package targets iOS 18+ only. Full package tests require a macOS host
# with Xcode and an iOS Simulator (see Run-Tests.sh).
#
# Options:
# 1. Enable a self-hosted macOS runner and uncomment the test step below.
# 2. Run tests locally: ./Run-Tests.sh
#
# This pipeline validates that the repository is non-empty and Package.swift parses.

image: atlassian/default-image:4

pipelines:
  default:
    - step:
        name: Package manifest sanity check
        script:
          - test -f Package.swift
          - test -f GCDWebServer/Core/GCDWebServer.m
          - test -f Tests/GCDWebServerTests.m
          - test -f Tests/MobileLockerContractTests.m
          - grep -q 'iOS' Package.swift
          - '! grep -q macos Package.swift'
          - '! grep -q tvOS Package.swift'
          - test ! -d Mac
          - test ! -d tvOS
          - echo "Manifest OK. Run iOS unit tests on a Mac with Xcode (./Run-Tests.sh)."

